<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    >
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f7e7a3">
    <meta name="description" content="Choose how you want to pay Mud Goods.">
    <title>Mud Goods Payment</title>
    <link rel="icon" href="assets/mud-goods-logo.png?v=6">
    <link rel="apple-touch-icon" href="assets/mud-goods-logo.png?v=6">
    <link rel="stylesheet" href="styles.css?v=6">
  </head>
  <body>
    <main class="payment-page" aria-labelledby="payment-heading">
      <section class="payment-panel" aria-label="Mud Goods payment links">
        <img class="brand-logo" src="assets/mud-goods-logo.png?v=6" alt="Mud Goods logo" width="1024" height="1024">

        <div class="intro">
          <h1 id="payment-heading">Choose how you want to pay:</h1>
        </div>

        <nav class="payment-links" aria-label="Payment options">
          <a
            class="payment-button venmo"
            href="https://venmo.com/u/mudgoods"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
          >
            <span class="payment-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img" focusable="false">
                <path d="M30.6 13.2c1.7 2.8 2.3 5.7 1.7 8.8-.9 5.6-5 11.9-12.2 18.8h-6l-4.8-28h8.1l2.4 17.8c3.3-3.7 5.2-7 5.6-9.9.3-2-.1-3.9-1.2-5.8l6.4-1.7Z"/>
              </svg>
            </span>
            <span class="payment-name">Venmo</span>
          </a>

          <a
            class="payment-button cash-app"
            href="https://cash.app/$MudGoods"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
          >
            <span class="payment-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img" focusable="false">
                <path d="M26.1 8.4v4.1c3 .3 5.3 1.2 7 2.6l-2.8 5.1a11.7 11.7 0 0 0-6.1-1.9c-2.1 0-3.4.8-3.4 2.1 0 1.4 1.7 1.9 4.5 2.9 4.6 1.5 8.4 3.2 8.4 8.4 0 4.2-2.8 7.1-7.5 7.8v4.1h-4.9v-4c-3.7-.4-6.8-1.7-9.1-3.7l3.2-5a13.1 13.1 0 0 0 7.4 2.7c2.4 0 3.7-.8 3.7-2.3 0-1.6-1.9-2.2-4.8-3.1-4.2-1.3-8-3-8-8.1 0-4.1 2.8-7 7.5-7.6V8.4h4.9Z"/>
              </svg>
            </span>
            <span class="payment-name">Cash App</span>
          </a>

          <a
            class="payment-button paypal"
            href="https://paypal.me/mudgoods"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
          >
            <span class="payment-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" role="img" focusable="false">
                <path d="M16.1 39.6h-6l5.8-31.2h12.9c5.9 0 9.4 3.5 8.6 8.8-.8 5.8-4.9 9.1-11.4 9.1h-5.5l-1.3 7.1h5.2c6.2 0 10.6-3.1 12.6-8.4 1.7 1.5 2.4 3.8 2 6.5-.8 5.8-4.9 9-11.3 9h-8.3l-1.4 7.1h-6l4.1-8Zm5.4-18.9h4.7c3 0 4.8-1.2 5.2-3.6.4-2.1-.9-3.3-3.6-3.3h-6.2l-1.1 6.9Z"/>
              </svg>
            </span>
            <span class="payment-name">PayPal</span>
          </a>
        </nav>

        <p class="helper-text" role="status" aria-live="polite">
          <span>Thank you for supporting us!</span>
          <span>You just made a small artist's day &lt;3</span>
        </p>
      </section>
    </main>
  </body>
</html>
